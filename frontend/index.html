<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="JobBoard - Discover live jobs, companies, categories and trending opportunities."
    >

    <title>JobBoard | Find Your Next Opportunity</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <header id="site-header"></header>

    <main>

        <section class="hero-section">

            <div class="container">

                <div class="hero-content">

                    <span class="eyebrow">
                        LIVE JOB DISCOVERY
                    </span>

                    <h1>
                        Find your next opportunity.
                    </h1>

                    <p>
                        Discover jobs from multiple live sources
                        in one simple place.
                    </p>


                    <form
                        id="home-search-form"
                        class="hero-search"
                    >

                        <div class="search-field">

                            <label for="home-keyword">
                                What are you looking for?
                            </label>

                            <input
                                id="home-keyword"
                                name="keyword"
                                type="text"
                                placeholder="Job title, skill or keyword"
                            >

                        </div>


                        <div class="search-field">

                            <label for="home-location">
                                Location
                            </label>

                            <input
                                id="home-location"
                                name="location"
                                type="text"
                                placeholder="City, state or country"
                            >

                        </div>


                        <button
                            type="submit"
                            class="button button-primary"
                        >
                            Search Jobs
                        </button>

                    </form>

                </div>

            </div>

        </section>


        <section class="stats-section">

            <div class="container">

                <div
                    id="home-stats"
                    class="stats-grid"
                >

                    <div class="stat-card">
                        <strong id="stat-jobs">—</strong>
                        <span>Jobs</span>
                    </div>

                    <div class="stat-card">
                        <strong id="stat-companies">—</strong>
                        <span>Companies</span>
                    </div>

                    <div class="stat-card">
                        <strong id="stat-categories">—</strong>
                        <span>Categories</span>
                    </div>

                </div>

            </div>

        </section>


        <section class="section">

            <div class="container">

                <div class="section-header">

                    <div>
                        <span class="eyebrow">
                            OPPORTUNITIES
                        </span>

                        <h2>
                            Latest jobs
                        </h2>
                    </div>

                    <a
                        href="jobs.html"
                        class="text-link"
                    >
                        View all jobs
                    </a>

                </div>


                <div
                    id="home-jobs"
                    class="jobs-grid"
                ></div>

            </div>

        </section>


        <section class="section section-muted">

            <div class="container">

                <div class="section-header">

                    <div>
                        <span class="eyebrow">
                            EXPLORE
                        </span>

                        <h2>
                            Browse categories
                        </h2>
                    </div>

                    <a
                        href="categories.html"
                        class="text-link"
                    >
                        All categories
                    </a>

                </div>


                <div
                    id="home-categories"
                    class="categories-grid"
                ></div>

            </div>

        </section>


        <section class="section">

            <div class="container">

                <div class="section-header">

                    <div>
                        <span class="eyebrow">
                            TRENDING
                        </span>

                        <h2>
                            Trending opportunities
                        </h2>
                    </div>

                </div>


                <div
                    id="home-trending"
                    class="jobs-grid"
                ></div>

            </div>

        </section>

    </main>

    <footer id="site-footer"></footer>


    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
